@if (isLoginPage()) {
  <main class="full-page-content">
    <router-outlet></router-outlet>
  </main>
} @else {
  <div class="app-layout">
    <!-- Top Global App Bar with Hamburger Menu Button -->
    <header class="app-topbar">
      <button class="menu-toggle-btn" (click)="toggleDrawer()" aria-label="Abrir menú lateral">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="topbar-brand">
        <span class="brand-text">CheckUp+</span>
      </div>

      <div class="topbar-actions">
        <a routerLink="/profile" class="topbar-user-avatar" title="Mi Perfil">
          <img src="https://i.pravatar.cc/150?img=33" alt="Carlos" />
        </a>
      </div>
    </header>

    <!-- Lateral Drawer Backdrop Overlay -->
    @if (isDrawerOpen()) {
      <div class="drawer-backdrop" (click)="closeDrawer()"></div>
    }

    <!-- Lateral Drawer Slide-over Menu Sidebar -->
    <aside class="side-drawer" [class.open]="isDrawerOpen()">
      <div class="drawer-header">
        <div class="drawer-brand">
          <div class="drawer-logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <span class="drawer-title">CheckUp+</span>
        </div>
        <button class="drawer-close-btn" (click)="closeDrawer()" aria-label="Cerrar menú">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- User Profile Box Snippet inside Drawer -->
      <div class="drawer-user-box" routerLink="/profile" (click)="closeDrawer()">
        <img src="https://i.pravatar.cc/150?img=33" alt="Carlos" class="drawer-avatar" />
        <div class="drawer-user-info">
          <span class="drawer-user-name">Carlos M. Rodríguez</span>
          <span class="drawer-user-id">ID: PV159800314791</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drawer-user-chevron">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>

      <!-- Navigation Links List inside Lateral Drawer -->
      <nav class="drawer-nav">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="drawer-item" (click)="closeDrawer()">
          <div class="item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <span class="item-label">Inicio</span>
        </a>

        <a routerLink="/appointments" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
          <div class="item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <span class="item-label">Mis Citas</span>
        </a>

        <a routerLink="/green-pass" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
          <div class="item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <path d="M14 14h3v3h-3v-3z"/>
              <path d="M18 18h3v3h-3v-3z"/>
              <path d="M14 18h2v2h-2v-2z"/>
              <path d="M18 14h2v2h-2v-2z"/>
            </svg>
          </div>
          <span class="item-label">Pase Verde</span>
        </a>

        <a routerLink="/profile" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
          <div class="item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <span class="item-label">Perfil</span>
        </a>

        <a routerLink="/settings" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
          <div class="item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span class="item-label">Configuración</span>
        </a>
      </nav>

      <!-- Drawer Footer with Logout -->
      <div class="drawer-footer">
        <button class="drawer-logout-btn" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
}
